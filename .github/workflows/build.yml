name: build

# Transitional CI for the stacked migration (part 1 of 3, see PR #3): the
# runtime is Node-based (package.json/node_modules exist) but the test suite
# still runs on `deno test` until part 2 lands, and the CLI/DMG build jobs
# return in part 3 (Node SEA + electron-builder — `deno compile` cannot build
# this hybrid tree).
on:
  push:
    branches: [main]
    tags: ["v*", "2026*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Firefox for tests
        run: npx playwright install firefox
      - run: deno --version
      - run: deno fmt --check
      - run: deno lint
      - run: deno check .
      - name: Run tests (headless runner via xvfb)
        run: xvfb-run -a deno test --allow-all
